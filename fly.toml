# Rename `app` to something unique, then: fly launch --no-deploy && fly deploy
app = "tennis-ladder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# The whole ladder is one SQLite file. Without this volume it is recreated
# empty on every deploy -- this is the single most important line in the file.
[[mounts]]
  source = "ladder_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # A club ladder is idle almost all the time. Suspending between requests
  # means you pay for the seconds it's actually used; the first request after
  # a quiet spell takes a second or two to wake.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  LADDER_DATA_DIR = "/data"
